services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: bytesavy
      MARIADB_USER: bytesavy
      MARIADB_PASSWORD: bytesavy_local
      MARIADB_ROOT_PASSWORD: root_local
    volumes:
      - wordpress_db:/var/lib/mysql

  wordpress:
    image: wordpress:6-php8.3-apache
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: bytesavy
      WORDPRESS_DB_USER: bytesavy
      WORDPRESS_DB_PASSWORD: bytesavy_local
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'local');
        define('WP_HOME', 'http://localhost:8080');
        define('WP_SITEURL', 'http://localhost:8080');
    volumes:
      - wordpress_data:/var/www/html

volumes:
  wordpress_db:
  wordpress_data:
